# ArgoCD Application for the orion-fed chart (Orion, MongoDB, CrateDB, QuantumLeap).
# Applies to the uop cluster, which runs its own in-cluster ArgoCD in the
# `argocd` namespace.
#
# Pulls the packaged chart from Harbor (OCI) at a pinned version rather than
# tracking the git repo's `main` branch — bump targetRevision here whenever
# a new chart version is packaged and pushed to Harbor.
#
# IMPORTANT: repoURL must NOT include the oci:// scheme, and the Harbor
# project path goes into `chart` alongside the chart name (not split across
# repoURL+chart) — ArgoCD 3.4.4 silently drops the chart name from the OCI
# manifest lookup URL otherwise (fails with "response status code 400: Bad
# Request" resolving the revision). See argoproj/argo-cd#25513 and
# https://argo-cd.readthedocs.io/en/stable/user-guide/private-repositories/#helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: orion-fed
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: uop
  source:
    repoURL: harbor.cop-pilot.rid-intrasoft.eu
    chart: cluster3e-flexibility/orion-fed
    targetRevision: "0.1.1"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=false
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
